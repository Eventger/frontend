# Proyecto Frontend independiente; identidad configurada mediante variables de Actions.
sonar.projectName=Eventger Frontend
sonar.sources=src
sonar.tests=tests,src
sonar.test.inclusions=tests/**,src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=false
