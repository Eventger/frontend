name: Frontend CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Commits nuevos y título del PR
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          npm run commitlint -- --from "$PR_BASE" --to "$PR_HEAD"
          printf '%s\n' "$PR_TITLE" | npm run commitlint -- --config ci/commitlint-pr.config.cjs
      - name: Resumen
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'Conventional Commits: %s. Se validan commits nuevos y título en PR; fuera de PR no se revisa historial.\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Si falla, corrige el mensaje indicado: tipo(scope opcional): descripción.' >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Comprobaciones de Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - name: Resumen
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'Oxlint y TypeScript: %s. Revisar archivo, línea y regla del paso fallido.\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Resumen
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'Build Frontend: %s. Genera dist/; no despliega en Vercel.\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Pruebas Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-evidence-${{ github.sha }}
          path: |
            reports/
            coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Resumen
        if: always()
        env:
          RESULT: ${{ job.status }}
          REVISION: ${{ github.sha }}
        run: |
          printf 'Pruebas Frontend: %s; revisión %s. Artifact frontend-evidence-%s: JUnit y LCOV.\n' "$RESULT" "$REVISION" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
          echo 'Pruebas de arranque/componentes en jsdom; no prueban Backend, Supabase, Vercel ni un navegador real.' >> "$GITHUB_STEP_SUMMARY"

  sonar:
    name: Análisis Sonar Frontend
    needs: tests
    if: >-
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && vars.SONAR_PR_ENABLED == 'true' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Análisis desactivado
        if: vars.SONAR_ENABLED != 'true'
        run: |
          echo 'Sonar: análisis no ejecutado (SONAR_ENABLED no es true).' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: vars.SONAR_ENABLED == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: vars.SONAR_ENABLED == 'true'
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: vars.SONAR_ENABLED == 'true'
        with:
          name: frontend-evidence-${{ github.sha }}
      - name: Validar configuración y preparar identidad
        if: vars.SONAR_ENABLED == 'true'
        env:
          SONAR_ENABLED: ${{ vars.SONAR_ENABLED }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node ci/sonar-config.mjs
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        if: vars.SONAR_ENABLED == 'true'
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Resumen del scanner
        if: success() && vars.SONAR_ENABLED == 'true'
        run: |
          echo 'Scanner ejecutado y análisis enviado. Comprobar procesamiento y Quality Gate en Sonar; no se exige el gate en esta etapa.' >> "$GITHUB_STEP_SUMMARY"
